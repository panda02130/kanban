body{font-family:'Noto Sans SC',sans-serif;background:var(--c-bg);color:var(--c-text);min-height:100vh;-webkit-font-smoothing:antialiased;}

.header p{font-size:14px;color:rgba(255,255,255,.82);margin-top:6px;}
.header-credit{text-align:right;flex-shrink:0;margin-left:24px;}
.header-credit .label{font-size:12px;color:rgba(255,255,255,.5);letter-spacing:2px;text-transform:uppercase;}
.header-credit .name{font-size:20px;font-weight:900;color:#fff;margin-top:2px;}
.tabs{display:flex;gap:10px;padding:20px 56px 0;max-width:1500px;margin:0 auto;flex-wrap:wrap;}
.tab-btn{padding:11px 22px;border-radius:12px;border:1.5px solid var(--c-border);background:var(--c-card);color:var(--c-text3);font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;transition:all .25s;font-family:inherit;flex:1;text-align:center;}
.tab-btn:hover{border-color:var(--c-accent);color:var(--c-accent);}

.content{padding:24px 56px 40px;max-width:1500px;margin:0 auto;}
.page{display:none;animation:fadeIn .35s ease;}
.page.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.top-section{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px;}

.bottom-section{display:grid;grid-template-columns:1.05fr .95fr;gap:20px;}

.heatmap td:first-child{text-align:left;color:var(--c-text2);font-weight:500;background:#F7F4EE;font-size:12.5px;line-height:1.4;}

let activeTab='w', trendOpt=0;
function init(){renderTabs();render();}
function renderTabs(){
  const el=document.getElementById('tabs');el.innerHTML='';
  TABS.forEach(t=>{
    const b=document.createElement('button');
    b.className='tab-btn'+(t.id===activeTab?' active':'');
    b.textContent=t.short;
    b.onclick=()=>{activeTab=t.id;trendOpt=0;renderTabs();render();};
    el.appendChild(b);
  });
}
function render(){
  const tab=TABS.find(t=>t.id===activeTab);
  const c=CONC[activeTab];
  let h='<div class="page active">';
  h+='<div class="top-section"><div class="conclusion-card">🔍 '+c.title+'</div><div class="insights-panel">';
  c.ins.forEach(i=>{h+='<div class="insight"><div class="insight-icon">'+i.icon+'</div><div><div class="insight-title">'+i.t+'</div><div class="insight-text">'+i.d+'</div></div></div>';});
  h+='</div></div>';
  h+= tab.type==='trend'?renderTrendTab(tab):(tab.type==='diag'?renderDiagTab(tab):(tab.type==='channel'?renderChannelTab(tab):renderProductTab(tab)));
  h+='<div class="footer">数据来源：人文学情问卷底表 141-145学季 · 分母=各题去重答卷人数 · 分析：洛书</div></div>';
  document.getElementById('content').innerHTML=h;
}

function renderTrendTab(tab){
  const md=DATA.modules[tab.mod], comp=DATA.composition[tab.mod];
  let h='<div class="q-card"><div class="q-title">'+tab.mod+' · 25秋 → 26寒 → 26春 · 结论配图</div><div class="q-text">每条结论下方配一张可单独截图的热力图（期次×年级）。行=25秋/26寒/26春，列=年级，颜色越深占比越高。</div></div>';
  // 年级构成条(前置说明)
  h+='<div class="card"><div class="section-title">👥 各期答卷年级构成（先看结构漂移，解释为何要分年级）</div>';
  SEASONS.forEach(s=>{
    const cc=comp[s];
    h+='<div class="comp-row"><div class="comp-label">'+s+'（N='+cc.N.toLocaleString()+'）</div><div class="comp-bar">';
    GRADES.forEach(g=>{const w=cc[g];if(w>0)h+='<div class="comp-seg" style="width:'+w+'%;background:'+GC[g]+'">'+(w>=6?w+'%':'')+'</div>';});
    h+='</div></div>';
  });
  h+='<div class="note">⚠️ 25秋三年级占48.6%、二年级仅3.1%；26春二年级涨到18.3%、六年级降到5.1%。构成差异大，"全年级合计"失真，故下方锁定同一年级看趋势。</div></div>';
  // 逐条结论 + 专属热力图
  (TREND_CARDS[tab.mod]||[]).forEach(card=>{
    h+='<div class="card">';
    h+='<div class="section-title">📌 '+card.t+'</div>';
    h+='<div style="font-size:14px;line-height:1.85;color:var(--c-text);background:linear-gradient(135deg,#FFF8F0,#F0F7F4);border:1px solid #E6DDD0;border-radius:12px;padding:16px 20px;margin-bottom:14px">'+card.d+'</div>';
    h+=renderOptHeatmap(md, card.opts);
    h+='<div class="note">'+card.cap+'</div>';
    h+='</div>';
  });
  return h;
}

// 聚焦若干需求项的"期次×年级"热力图(行=期次,列=年级),可单独截图
function renderOptHeatmap(md, opts){
  let h='<div class="heatmap-wrap"><table class="heatmap"><thead><tr><th>需求项 · 期次 \\ 年级</th>';
  GRADES.forEach(g=>{h+='<th style="color:'+GC[g]+'">'+GL[g]+'</th>';});
  h+='</tr></thead><tbody>';
  opts.forEach((o,oi)=>{
    SEASONS.forEach((s,si)=>{
      h+='<tr><td>'+(si===0?'<b>'+shortOpt(o)+'</b> · ':'　　　　')+s+'</td>';
      GRADES.forEach(g=>{const v=md.data[o][s][g];h+='<td class="'+heatClass(v)+'">'+v+'</td>';});
      h+='</tr>';
    });
    if(oi<opts.length-1) h+='<tr><td colspan="6" style="background:transparent;padding:3px"></td></tr>';
  });
  h+='</tbody></table></div>';
  return h;
}

function shortOpt(o){return o.split('，')[0].split('（')[0];}

function renderTrendHeatmap(md){
  // 表头：选项 | 各年级(每年级3期)
  let h='<div class="heatmap-wrap"><table class="heatmap"><thead><tr><th>需求项 \\ 年级·期次</th>';
  GRADES.forEach(g=>{h+='<th colspan="3" style="color:'+GC[g]+'">'+GL[g]+'</th>';});
  h+='</tr><tr><th></th>';
  GRADES.forEach(g=>{SEASONS.forEach(s=>{h+='<th class="season-h" style="color:'+GC[g]+'99">'+s.replace('25','').replace('26','')+'</th>';});});
  h+='</tr></thead><tbody>';
  md.opts.forEach(o=>{
    h+='<tr><td>'+shortOpt(o)+'</td>';
    GRADES.forEach(g=>{SEASONS.forEach(s=>{const v=md.data[o][s][g];h+='<td class="'+heatClass(v)+'">'+v+'</td>';});});
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  return h;
}

  h+='<div class="heatmap-wrap"><table class="heatmap"><thead><tr><th>选项 \\ 年级</th><th style="color:var(--c-accent)">合计</th>';
  validG.forEach(g=>{h+='<th style="color:'+GC[g]+'">'+GL[g]+'</th>';});
  h+='</tr></thead><tbody>';
  d.opts.forEach(o=>{
    h+='<tr><td>'+o+'</td><td class="'+heatClass(d.all[o])+'">'+d.all[o]+'</td>';
    validG.forEach(g=>{const v=d.data[g][o];h+='<td class="'+heatClass(v)+'">'+v+'</td>';});
    h+='</tr>';
  });
  h+='</tbody></table></div></div>';
  // 合计排序条形
  h+='<div class="card"><div class="section-title">📊 全年级合计占比排序</div>';
  const maxv=Math.max(...d.opts.map(o=>d.all[o]));
  d.opts.forEach(o=>{
    const v=d.all[o];
    h+='<div style="margin-bottom:12px"><div style="font-size:12.5px;color:var(--c-text2);margin-bottom:4px">'+o+'</div>';
    h+='<div style="display:flex;align-items:center;gap:8px"><div style="flex:1;height:20px;background:#F2E4D8;border-radius:6px;overflow:hidden"><div style="width:'+(v/maxv*100)+'%;height:100%;background:var(--c-accent);border-radius:6px"></div></div><span style="font-size:13px;font-weight:700;color:var(--c-accent);min-width:44px;text-align:right">'+v+'%</span></div></div>';
  });
  h+='</div></div>';
  return h;
}

  let h='<div class="q-card"><div class="q-title">分品 · 6阶段用户需求演进（一屏概览）</div><div class="q-text">行=需求项，列=产品阶段（时间从左到右）。颜色越深占比越高。红框列为断层跃升点。IP品混在尖子生班内，与"纯主流"并列对比。</div></div>';
  ['写作','阅读'].forEach(qt=>{
    const d=PRDATA.q[qt];
    let opts=Object.keys(d[orderKey].opts).filter(o=>o!=='其他');
    opts.sort((a,b)=>d[orderKey].opts[b]-d[orderKey].opts[a]);
    h+='<div class="card"><div class="section-title">'+(qt==='写作'?'✍️':'📖')+' '+qt+'模块 · 分品阶段需求占比热力（%）</div>';
    h+='<div class="heatmap-wrap"><table class="heatmap"><thead><tr><th style="min-width:150px">需求项 \\ 阶段</th>';
    STG.forEach(st=>{
      const jump = st==='4尖子生后(26春5-9,含IP)';
      const lbl=SS[st].split('\n');
      h+='<th style="'+(jump?'background:#FBEEE6;border:2px solid #C47D5A;border-radius:8px;':'')+'"><div style="font-size:12px;font-weight:700">'+lbl[0]+'</div><div style="font-size:10px;color:var(--c-text3);font-weight:400">'+lbl[1]+'</div><div style="font-size:9.5px;color:var(--c-text3)">n='+N[st]+'</div></th>';
    });
    h+='</tr></thead><tbody>';
    opts.forEach(o=>{
      h+='<tr><td>'+shortOpt(o)+'</td>';
      STG.forEach(st=>{const v=d[st].opts[o]||0;const jump=st==='4尖子生后(26春5-9,含IP)';h+='<td class="'+heatClass(v)+'" style="'+(jump?'outline:2px solid #C47D5A;':'')+'">'+v+'</td>';});
      h+='</tr>';
    });
    h+='</tbody></table></div>';
    if(qt==='写作') h+='<div class="note">📈 思想深度：作文课42.2 → 阅写课44.5 → 尖子生前46.1 →（断层）尖子生后70.0（+24pp）。四项写作需求在尖子生后阶段整体跳升。⚠️ 需求真升 + 26春5期问卷措辞升级双因素。</div>';
    else h+='<div class="note">📈 内容理解：作文课61.2 →（断层）尖子生后74.4（+13pp）。解题思路全程高位。IP品(刘磊/陈心)列与纯主流列几乎同色，需求同质。</div>';
    h+='</div>';
  });
  return h;
}

function renderChannelTab(tab){
  const CH=CHDATA.channels, size=CHDATA.size;
  let h='<div class="q-card"><div class="q-title">26春(145) · 三渠道对标 · 仅未退款用户</div><div class="q-text">识别规则：key_from含 99rwip=99IP(刘磊)、含 199rwlq=199陈心、一级渠道=辅导召回=内部导流　｜　规模：内部导流 '+size['内部导流'].toLocaleString()+' · 99IP '+size['99IP(刘磊)'].toLocaleString()+' · 199陈心 '+size['199陈心'].toLocaleString()+'</div></div>';
  // 需求对比: 写作 & 阅读 分组横向柱
  ['写作','阅读'].forEach(qt=>{
    const q=CHDATA.q[qt];
    // 用内部导流的选项顺序
    let opts=Object.keys(q['内部导流'].opts).filter(o=>o!=='其他');
    opts.sort((a,b)=>q['99IP(刘磊)'].opts[b]-q['99IP(刘磊)'].opts[a]);
    h+='<div class="card"><div class="section-title">📊 '+qt+'模块需求 · 三渠道对比（n：内部导流'+q['内部导流'].n+' / 99IP'+q['99IP(刘磊)'].n+' / 199陈心'+q['199陈心'].n+'）</div>';
    opts.forEach(o=>{
      h+='<div style="margin-bottom:14px"><div style="font-size:12.5px;color:var(--c-text2);margin-bottom:5px;font-weight:600">'+shortOpt(o)+'</div>';
      CH.forEach(c=>{
        const v=q[c].opts[o]||0;
        h+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:3px"><span style="font-size:11px;color:'+CHCOLOR[c]+';min-width:78px;font-weight:600">'+c+'</span><div style="flex:1;height:16px;background:#F2E4D8;border-radius:5px;overflow:hidden"><div style="width:'+v+'%;height:100%;background:'+CHCOLOR[c]+';border-radius:5px"></div></div><span style="font-size:12px;font-weight:700;color:'+CHCOLOR[c]+';min-width:42px;text-align:right">'+v+'%</span></div>';
      });
      h+='</div>';
    });
    h+='</div>';
  });
  // 续报 + 满意度
  h+='<div class="bottom-section">';
  // 续报
  h+='<div class="card"><div class="section-title">🔄 续报意愿对比</div>';
  const rn=CHDATA.q['续报'];
  const rnopts=['会的:孩子喜欢，价格合适','再想想:看看效果再定','不考虑:课程没有达到预期'];
  const rnlabel={'会的:孩子喜欢，价格合适':'会续报','再想想:看看效果再定':'再想想','不考虑:课程没有达到预期':'不考虑'};
  h+='<table class="heatmap" style="width:100%"><thead><tr><th>渠道</th>';
  rnopts.forEach(o=>{h+='<th>'+rnlabel[o]+'</th>';});
  h+='</tr></thead><tbody>';
  CH.forEach(c=>{
    h+='<tr><td style="color:'+CHCOLOR[c]+';font-weight:700">'+c+'</td>';
    rnopts.forEach(o=>{const v=rn[c].opts[o]||0;h+='<td class="'+heatClass(v)+'">'+v+'%</td>';});
    h+='</tr>';
  });
  h+='</tbody></table><div class="note">"会续报"IP品(25%左右)明显高于内部导流(18.3%)；"不考虑"内部导流7.2%约为IP品3倍。</div></div>';
  // 满意度(4+5分合计)
  h+='<div class="card"><div class="section-title">⭐ 满意度对比（5分超喜欢 / 4+分满意）</div>';
  h+='<table class="heatmap" style="width:100%"><thead><tr><th>渠道</th><th>作文·5分</th><th>作文·4+</th><th>阅读·5分</th><th>阅读·4+</th></tr></thead><tbody>';
  CH.forEach(c=>{
    const sw=CHDATA.q['作文满意'][c].opts, sr=CHDATA.q['阅读满意'][c].opts;
    const w5=sw['5分-超级喜欢']||0, w4=w5+(sw['4分-挺喜欢的']||0);
    const r5=sr['5分-超级喜欢']||0, r4=r5+(sr['4分-挺喜欢的']||0);
    h+='<tr><td style="color:'+CHCOLOR[c]+';font-weight:700">'+c+'</td><td class="'+heatClass(w5)+'">'+w5.toFixed(1)+'%</td><td class="'+heatClass(w4)+'">'+w4.toFixed(1)+'%</td><td class="'+heatClass(r5)+'">'+r5.toFixed(1)+'%</td><td class="'+heatClass(r4)+'">'+r4.toFixed(1)+'%</td></tr>';
  });
  h+='</tbody></table><div class="note">三渠道4+满意度均93-95%高位；199陈心"超级喜欢"占比最高，小样本(380)下略偏高需谨慎。</div></div>';
  h+='</div>';
  return h;
}

function setTrend(i){trendOpt=i;render();}

function drawTrend(){
  const canvas=document.getElementById('trendCanvas');if(!canvas)return;
  const tab=TABS.find(t=>t.id===activeTab);const md=DATA.modules[tab.mod];
  const opt=md.opts[trendOpt];
  const dpr=window.devicePixelRatio||1;const rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;
  const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
  const W=rect.width,H=rect.height;const padL=48,padR=24,padT=24,padB=40;
  const plotW=W-padL-padR,plotH=H-padT-padB;
  ctx.clearRect(0,0,W,H);
  // y range across all grades/seasons for this opt
  let all=[];GRADES.forEach(g=>SEASONS.forEach(s=>all.push(md.data[opt][s][g])));
  let vmin=Math.min(...all),vmax=Math.max(...all);const range=(vmax-vmin)||1;
  const y0=vmin-range*0.2,y1=vmax+range*0.2,yr=y1-y0;
  ctx.strokeStyle='#EBE6DC';ctx.lineWidth=1;ctx.font='11px Noto Sans SC';ctx.fillStyle='#A69F8E';ctx.textAlign='right';
  for(let i=0;i<=4;i++){const y=padT+(1-i/4)*plotH;const v=(y0+i/4*yr).toFixed(0);
    ctx.beginPath();ctx.setLineDash([4,4]);ctx.moveTo(padL,y);ctx.lineTo(W-padR,y);ctx.stroke();ctx.setLineDash([]);
    ctx.fillText(v+'%',padL-8,y+4);}
  // x labels = seasons
  ctx.textAlign='center';ctx.fillStyle='#7A7362';ctx.font='12px Noto Sans SC';
  SEASONS.forEach((s,i)=>{const x=padL+(i/(SEASONS.length-1))*plotW;ctx.fillText(s,x,H-14);});
  // one line per grade
  GRADES.forEach(g=>{
    const pts=SEASONS.map((s,i)=>({x:padL+(i/(SEASONS.length-1))*plotW,y:padT+(1-(md.data[opt][s][g]-y0)/yr)*plotH,v:md.data[opt][s][g]}));
    ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);pts.forEach((p,i)=>{if(i>0)ctx.lineTo(p.x,p.y);});
    ctx.strokeStyle=GC[g];ctx.lineWidth=g==='6'?2:2.6;ctx.lineJoin='round';
    if(g==='6')ctx.setLineDash([5,4]);ctx.stroke();ctx.setLineDash([]);
    pts.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle=GC[g];ctx.lineWidth=2.4;ctx.stroke();});
  });
  // legend
  const lg=document.getElementById('legend');
  if(lg)lg.innerHTML=GRADES.map(g=>'<div class="legend-item"><div class="legend-dot" style="background:'+GC[g]+'"></div>'+GL[g]+(g==='6'?'(虚线·样本少)':'')+'</div>').join('');
}
window.addEventListener('resize',()=>{const t=TABS.find(t=>t.id===activeTab);if(t&&t.type==='trend')drawTrend();});
init();
</script>
