.header-inner{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1;max-width:1500px;margin:0 auto;}

.header p{font-size:14px;color:rgba(255,255,255,.82);margin-top:6px;}
.header-credit{text-align:right;flex-shrink:0;margin-left:24px;}
.header-credit .label{font-size:12px;color:rgba(255,255,255,.5);letter-spacing:2px;text-transform:uppercase;}
.header-credit .name{font-size:20px;font-weight:900;color:#fff;margin-top:2px;}
.tabs{display:flex;gap:14px;padding:20px 56px 0;max-width:1500px;margin:0 auto;flex-wrap:wrap;}
.tab-group{background:#FBF9F4;border:1px solid var(--c-border);border-radius:14px;padding:10px 12px 12px;flex:1;min-width:280px;}
.tab-group-title{font-size:12.5px;font-weight:700;letter-spacing:1px;margin-bottom:8px;padding-left:2px;}
.tab-group-btns{display:flex;gap:8px;flex-wrap:wrap;}
.tab-btn{padding:9px 14px;border-radius:10px;border:1.5px solid var(--c-border);background:var(--c-card);color:var(--c-text3);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;transition:all .25s;font-family:inherit;flex:1;text-align:center;}

.tab-btn.active{color:#fff;font-weight:700;box-shadow:0 4px 14px rgba(61,57,41,.18);}
.content{padding:24px 56px 40px;max-width:1500px;margin:0 auto;}
.page{display:none;animation:fadeIn .35s ease;}
.page.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.top-section{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px;}
.conclusion-card{background:linear-gradient(135deg,#FFF8F0 0%,#F0F7F4 50%,#F0F0FA 100%);border-radius:var(--radius);border:1px solid #E6DDD0;padding:26px 28px;box-shadow:var(--shadow-md);line-height:1.9;font-size:14.5px;color:var(--c-text);}

.insight-icon{font-size:20px;flex-shrink:0;margin-top:2px;}

.q-card{background:var(--c-card);border-radius:var(--radius);border:1px solid var(--c-border);padding:16px 24px;box-shadow:var(--shadow-sm);margin-bottom:20px;}
.q-title{font-size:12px;color:var(--c-accent);font-weight:700;margin-bottom:4px;letter-spacing:2px;text-transform:uppercase;}
.q-text{font-size:15px;color:var(--c-text);line-height:1.6;}
.card{background:var(--c-card);border-radius:var(--radius);border:1px solid var(--c-border);padding:22px 26px;box-shadow:var(--shadow-sm);margin-bottom:20px;}
.section-title{font-size:15px;font-weight:700;color:var(--c-text);margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.bottom-section{display:grid;grid-template-columns:1.05fr .95fr;gap:20px;}
.heatmap-wrap{overflow-x:auto;}
.heatmap{width:100%;border-collapse:separate;border-spacing:5px;font-size:13.5px;}

.heatmap th:first-child{text-align:left;color:var(--c-text3);font-weight:500;max-width:230px;white-space:normal;}
.heatmap td{padding:10px 8px;text-align:center;border-radius:9px;font-weight:700;color:#fff;font-size:13px;}
.heatmap td:first-child{text-align:left;color:var(--c-text2);font-weight:500;background:#F7F4EE;font-size:12.5px;line-height:1.4;}
.heat-h{background:#C47D5A;}.heat-m{background:#D9A585;}.heat-l{background:#E7C9B4;color:#7A5638!important;}.heat-v{background:#F2E4D8;color:#A67C5A!important;}

.comp-row{margin-bottom:12px;}

let activeTab='w', trendOpt=0;
function init(){renderTabs();render();}
const GROUPS=[
  {name:'一、需求演进',icon:'📈',color:'#C47D5A'},
  {name:'二、用户画像',icon:'👥',color:'#6B7FA3'},
  {name:'三、效果转化',icon:'🎯',color:'#5B8A72'}
];
const GKEY={'需求演进':0,'用户画像':1,'效果转化':2};
function renderTabs(){
  const el=document.getElementById('tabs');el.innerHTML='';
  GROUPS.forEach((grp,gi)=>{
    const gname=Object.keys(GKEY)[gi];
    const wrap=document.createElement('div');wrap.className='tab-group';
    wrap.innerHTML='<div class="tab-group-title" style="color:'+grp.color+'">'+grp.icon+' '+grp.name+'</div>';
    const row=document.createElement('div');row.className='tab-group-btns';
    TABS.filter(t=>t.g===gname).forEach(t=>{
      const b=document.createElement('button');
      b.className='tab-btn'+(t.id===activeTab?' active':'');
      if(t.id===activeTab) b.style.background=grp.color,b.style.borderColor=grp.color;
      b.textContent=t.short;
      b.onclick=()=>{activeTab=t.id;trendOpt=0;renderTabs();render();window.scrollTo(0,0);};
      row.appendChild(b);
    });
    wrap.appendChild(row);el.appendChild(wrap);
  });
}
function render(){
  const tab=TABS.find(t=>t.id===activeTab);
  const c=CONC[activeTab];
  let h='<div class="page active">';
  h+='<div class="top-section"><div class="conclusion-card">🔍 '+c.title+'</div><div class="insights-panel">';
  c.ins.forEach(i=>{h+='<div class="insight"><div class="insight-icon">'+i.icon+'</div><div><div class="insight-title">'+i.t+'</div><div class="insight-text">'+i.d+'</div></div></div>';});
  h+='</div></div>';
  const R={trend:renderTrendTab,diag:renderDiagTab,channel:renderChannelTab,product:renderProductTab,
           profile:renderProfileTab,renew:renderRenewTab,gain:renderGainTab,satis:renderSatisTab};
  h+=(R[tab.type]||renderTrendTab)(tab);
  h+='<div class="footer">数据来源：人文学情问卷底表 141-145学季 · 分母=各题去重答卷人数 · 分析：洛书</div></div>';
  document.getElementById('content').innerHTML=h;
}

function renderTrendTab(tab){
  const md=DATA.modules[tab.mod], comp=DATA.composition[tab.mod];
  let h='<div class="q-card"><div class="q-title">'+tab.mod+' · 25秋 → 26寒 → 26春 · 结论配图</div><div class="q-text">每条结论下方配一张可单独截图的热力图（期次×年级）。行=25秋/26寒/26春，列=年级，颜色越深占比越高。</div></div>';

  h+='<div class="card"><div class="section-title">👥 各期答卷年级构成（先看结构漂移，解释为何要分年级）</div>';
  SEASONS.forEach(s=>{
    const cc=comp[s];
    h+='<div class="comp-row"><div class="comp-label">'+s+'（N='+cc.N.toLocaleString()+'）</div><div class="comp-bar">';
    GRADES.forEach(g=>{const w=cc[g];if(w>0)h+='<div class="comp-seg" style="width:'+w+'%;background:'+GC[g]+'">'+(w>=6?w+'%':'')+'</div>';});

// 聚焦若干需求项的"期次×年级"热力图(行=期次,列=年级),可单独截图
function renderOptHeatmap(md, opts){
  let h='<div class="heatmap-wrap"><table class="heatmap"><thead><tr><th>需求项 · 期次 \\ 年级</th>';
  GRADES.forEach(g=>{h+='<th style="color:'+GC[g]+'">'+GL[g]+'</th>';});
  h+='</tr></thead><tbody>';
  opts.forEach((o,oi)=>{
    SEASONS.forEach((s,si)=>{
      h+='<tr><td>'+(si===0?'<b>'+shortOpt(o)+'</b> · ':'　　　　')+s+'</td>';
      GRADES.forEach(g=>{const v=md.data[o][s][g];h+='<td class="'+heatClass(v)+'">'+v+'</td>';});
      h+='</tr>';
    });
    if(oi<opts.length-1) h+='<tr><td colspan="6" style="background:transparent;padding:3px"></td></tr>';
  });
  h+='</tbody></table></div>';
  return h;
}

function shortOpt(o){return o.split('，')[0].split('（')[0];}

}

// 通用: 一组"选项×期次"折线趋势表(行=选项,列=期次,末列Δ)——用于续报/收获/满意点
function seasonHeatTable(dataBySeason, seasons, opts, shorten){
  let h='<div class="heatmap-wrap"><table class="heatmap"><thead><tr><th style="min-width:180px">选项 \\ 期次</th>';
  seasons.forEach(s=>{h+='<th>'+s+'<div style="font-size:10px;color:var(--c-text3);font-weight:400">n='+(dataBySeason[s]?dataBySeason[s].n:0)+'</div></th>';});
  h+='<th style="color:var(--c-accent)">Δ(末-首)</th></tr></thead><tbody>';
  opts.forEach(o=>{
    const vals=seasons.map(s=>dataBySeason[s]&&dataBySeason[s].opts[o]!=null?dataBySeason[s].opts[o]:null);
    const first=vals.find(v=>v!=null), last=[...vals].reverse().find(v=>v!=null);
    const d=(first!=null&&last!=null)?(last-first):0;
    h+='<tr><td>'+(shorten?shorten(o):o)+'</td>';
    vals.forEach(v=>{h+=v==null?'<td style="background:#F5F2EC;color:#CCC">–</td>':'<td class="'+heatClass(v)+'">'+v+'</td>';});
    h+='<td style="font-weight:700;color:'+(d>=0?'#5B8A72':'#C0392B')+'">'+(d>0?'+':'')+d.toFixed(1)+'</td></tr>';
  });
  h+='</tbody></table></div>';return h;
}
// 通用: 单期横向柱(排序), 用于画像题
function hbars(opts, color){
  const max=Math.max(...opts.map(o=>o.v));
  let h='';
  opts.forEach(o=>{
    h+='<div style="margin-bottom:11px"><div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--c-text2);margin-bottom:4px"><span>'+o.k+'</span><span style="font-weight:700;color:'+color+'">'+o.v+'%</span></div>';
    h+='<div style="height:14px;background:#F2E4D8;border-radius:5px;overflow:hidden"><div style="width:'+(o.v/max*100)+'%;height:100%;background:'+color+';border-radius:5px"></div></div></div>';
  });
  return h;
}
function topOpts(d,maxn){
  let a=Object.entries(d.opts).filter(([k,v])=>k!=='其他'&&!k.includes('没看到')&&!k.includes('没有特别')&&v>=1).map(([k,v])=>({k:k.split(':')[0].split('(')[0],full:k,v}));
  a.sort((x,y)=>y.v-x.v);return maxn?a.slice(0,maxn):a;
}

// 迷你折线(SVG, 可截图)
function miniLine(labels, vals, color, unit){
  const W=680,H=200,padL=44,padR=24,padT=24,padB=34;
  const pw=W-padL-padR,ph=H-padT-padB;
  const vmin=Math.min(...vals),vmax=Math.max(...vals),rg=(vmax-vmin)||1;
  const y0=vmin-rg*0.25,y1=vmax+rg*0.25,yr=y1-y0;
  const pts=vals.map((v,i)=>({x:padL+(i/(labels.length-1))*pw,y:padT+(1-(v-y0)/yr)*ph,v}));
  let s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;font-family:Noto Sans SC">';
  for(let i=0;i<=4;i++){const y=padT+(1-i/4)*ph;const gv=(y0+i/4*yr).toFixed(0);
    s+='<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="#EBE6DC" stroke-dasharray="4 4"/>';
    s+='<text x="'+(padL-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="#A69F8E">'+gv+'</text>';}
  labels.forEach((l,i)=>{s+='<text x="'+pts[i].x+'" y="'+(H-12)+'" text-anchor="middle" font-size="12" fill="#7A7362">'+l+'</text>';});
  let dpath='M'+pts.map(p=>p.x+' '+p.y).join(' L');
  s+='<path d="'+dpath+'" fill="none" stroke="'+color+'" stroke-width="3" stroke-linejoin="round"/>';
  pts.forEach(p=>{s+='<circle cx="'+p.x+'" cy="'+p.y+'" r="5" fill="#fff" stroke="'+color+'" stroke-width="3"/>';
    s+='<text x="'+p.x+'" y="'+(p.y-12)+'" text-anchor="middle" font-size="13" font-weight="700" fill="'+color+'">'+p.v+'</text>';});
  s+='</svg>';return s;
}

function setTrend(i){trendOpt=i;render();}

function drawTrend(){
  const canvas=document.getElementById('trendCanvas');if(!canvas)return;
  const tab=TABS.find(t=>t.id===activeTab);const md=DATA.modules[tab.mod];
  const opt=md.opts[trendOpt];
  const dpr=window.devicePixelRatio||1;const rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;
  const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
  const W=rect.width,H=rect.height;const padL=48,padR=24,padT=24,padB=40;
  const plotW=W-padL-padR,plotH=H-padT-padB;
  ctx.clearRect(0,0,W,H);
  // y range across all grades/seasons for this opt
  let all=[];GRADES.forEach(g=>SEASONS.forEach(s=>all.push(md.data[opt][s][g])));
  let vmin=Math.min(...all),vmax=Math.max(...all);const range=(vmax-vmin)||1;
  const y0=vmin-range*0.2,y1=vmax+range*0.2,yr=y1-y0;
  ctx.strokeStyle='#EBE6DC';ctx.lineWidth=1;ctx.font='11px Noto Sans SC';ctx.fillStyle='#A69F8E';ctx.textAlign='right';
  for(let i=0;i<=4;i++){const y=padT+(1-i/4)*plotH;const v=(y0+i/4*yr).toFixed(0);
    ctx.beginPath();ctx.setLineDash([4,4]);ctx.moveTo(padL,y);ctx.lineTo(W-padR,y);ctx.stroke();ctx.setLineDash([]);
    ctx.fillText(v+'%',padL-8,y+4);}
  // x labels = seasons
  ctx.textAlign='center';ctx.fillStyle='#7A7362';ctx.font='12px Noto Sans SC';
  SEASONS.forEach((s,i)=>{const x=padL+(i/(SEASONS.length-1))*plotW;ctx.fillText(s,x,H-14);});
  // one line per grade
  GRADES.forEach(g=>{
    const pts=SEASONS.map((s,i)=>({x:padL+(i/(SEASONS.length-1))*plotW,y:padT+(1-(md.data[opt][s][g]-y0)/yr)*plotH,v:md.data[opt][s][g]}));
    ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);pts.forEach((p,i)=>{if(i>0)ctx.lineTo(p.x,p.y);});
    ctx.strokeStyle=GC[g];ctx.lineWidth=g==='6'?2:2.6;ctx.lineJoin='round';
    if(g==='6')ctx.setLineDash([5,4]);ctx.stroke();ctx.setLineDash([]);
    pts.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle=GC[g];ctx.lineWidth=2.4;ctx.stroke();});
  });
  // legend
  const lg=document.getElementById('legend');
  if(lg)lg.innerHTML=GRADES.map(g=>'<div class="legend-item"><div class="legend-dot" style="background:'+GC[g]+'"></div>'+GL[g]+(g==='6'?'(虚线·样本少)':'')+'</div>').join('');
}
window.addEventListener('resize',()=>{const t=TABS.find(t=>t.id===activeTab);if(t&&t.type==='trend')drawTrend();});
