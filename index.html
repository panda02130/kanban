      </select>

            <button @click="doImport()" class="px-3 py-1.5 text-xs bg-brand-600 text-white rounded-lg hover:bg-brand-700 transition-colors">导入数据</button>
            <button @click="$refs.fileIn.click()" class="px-3 py-1.5 text-xs border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">从文件导入</button>
            <input type="file" x-ref="fileIn" @change="fileImport($event)" accept=".json" class="hidden">
          </div>
          <div x-show="importMsg" class="mt-2 text-xs" :class="importOk?'text-green-600':'text-red-600'" x-text="importMsg"></div>
        </div>
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-sm border border-gray-100 dark:border-gray-700 p-4">
          <h3 class="text-sm font-semibold mb-3">导出与缓存</h3>
          <div class="space-y-2">
            <button @click="exportCSV()" class="w-full px-3 py-2 text-xs border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors text-left">导出当前产品 CSV</button>
            <button @click="exportJSON()" class="w-full px-3 py-2 text-xs border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors text-left">导出完整 JSON</button>
          </div>
          <hr class="my-3 dark:border-gray-700">
          <div class="flex justify-between items-center text-xs mb-2">
            <span class="text-gray-500">localStorage 缓存</span>
            <span :class="fromCache?'text-green-600 dark:text-green-400':'text-gray-400'" x-text="fromCache?'有缓存':'无缓存'"></span>
          </div>
          <button @click="clearCache()" class="w-full px-3 py-2 text-xs bg-red-50 dark:bg-red-900/30 text-red-600 dark:text-red-400 border border-red-200 dark:border-red-800 rounded-lg hover:bg-red-100 dark:hover:bg-red-900/50 transition-colors">清除本地缓存</button>
          <div class="mt-3 text-[10px] text-gray-400 space-y-0.5">
            <p>学期: <span x-text="(data?.meta?.semester||'-')+' '+( data?.meta?.season||'')"></span></p>
            <p>数据更新: <span x-text="data?.meta?.updatedAt||'-'"></span></p>
          </div>
        </div>
      </div>
    </section>

  </div>
</div>

<!-- ============ ALPINE LOGIC ============ -->
<script>
function dashboard() {
  return {
    darkMode: localStorage.getItem('suyang_dark') === '1',
    currentTab: 'core',
    currentProduct: 'renwen',
    currentPeriod: '4',
    channelFilter: '',
    data: null,
    fromCache: false,
    importText: '',
    importMsg: '',
    importOk: false,
    chartInstances: {},

    products: [
      {key:'renwen',label:'人文中价'},
      {key:'jianqiao',label:'剑桥中价'},
      {key:'siwei_mid',label:'思维中价'},
      {key:'siwei_low',label:'思维低价'},
      {key:'shuangyu',label:'双语低价'}
    ],
    tabs: [
      {key:'global',label:'全局总览'},
      {key:'core',label:'核心数据'},
      {key:'channel',label:'渠道分析'},
      {key:'user',label:'用户画像'},
      {key:'team',label:'团队分析'},
      {key:'attendance',label:'到课与服务'},
      {key:'satisfaction',label:'满意度与沟通'},
      {key:'deposit',label:'定金转化'},
      {key:'crosssell',label:'扩科与进班'},
      {key:'analysis',label:'数据分析'},
      {key:'data',label:'数据管理'}
    ],

    // ===== INIT =====
    init() {
      const cached = localStorage.getItem('suyang_dashboard_data');
      if (cached) {
        try { this.data = JSON.parse(cached); this.fromCache = true; } catch(e) {}
      }
      if (!this.data) {
        const el = document.getElementById('embedded-data');
        if (el) { try { this.data = JSON.parse(el.textContent); } catch(e) { this.data = {meta:{},renwen:[],jianqiao:[],siwei_mid:[],siwei_low:[],shuangyu:[],schedule:{},analysis:{}}; } }
      }
      const ps = this.periods;
      if (ps.length && !ps.includes(this.currentPeriod)) this.currentPeriod = ps[0];
      this.$nextTick(() => this.renderAllCharts());
    },

    // ===== COMPUTED HELPERS =====
    get periods() {
      return (this.data?.[this.currentProduct]||[]).map(d=>d.period).sort((a,b)=>Number(b)-Number(a));
    },
    get channelList() {
      return (this.curMod()?.byChannel||[]).map(c=>c.name);
    },
    curPeriodObj() { return (this.data?.[this.currentProduct]||[]).find(d=>d.period===this.currentPeriod)||null; },
    prevPeriodObj() { const n=Number(this.currentPeriod); return (this.data?.[this.currentProduct]||[]).find(d=>Number(d.period)===n-1)||null; },
    curMod() { return this.curPeriodObj()?.modules||null; },
    prevMod() { return this.prevPeriodObj()?.modules||null; },
    curOverall() {
      const m = this.curMod();
      if (!m) return null;
      if (this.channelFilter && m.byChannelOverall?.[this.channelFilter]) {
        return {...m.overall, ...m.byChannelOverall[this.channelFilter]};
      }
      return m.overall;
    },
    prevOverall() {
      const m = this.prevMod();
      if (!m) return null;
      if (this.channelFilter && m.byChannelOverall?.[this.channelFilter]) {
        return {...m.overall, ...m.byChannelOverall[this.channelFilter]};
      }
      return m.overall;
    },
    get channelFilterLabel() {
      return this.channelFilter ? ' ['+this.channelFilter+']' : '';
    },

    // ===== KPI CARDS =====
    get kpiCards() {
      const c = this.curOverall(); const p = this.prevOverall();
      if (!c) return [];
      const make = (label, cv, pv, unit, isRate) => {
        const val = cv!=null ? (isRate? this.n2(cv)+unit : cv+unit) : '-';
        let sub='-', cls='text-gray-400';
        if (pv!=null && cv!=null) {
          const d = cv-pv;
          if (isRate) { sub = '上期 '+this.n2(pv)+unit+' ('+(d>=0?'+':'')+d.toFixed(2)+'pp)'; }
          else { sub = '上期 '+pv+unit+' ('+(d>=0?'+':'')+d+')'; }
          cls = d>0?'text-green-600 dark:text-green-400':d<0?'text-red-600 dark:text-red-400':'text-gray-400';
        } else { sub = '上期: -'; }
        return {label, value:val, sub, cls};
      };
      return [
        make('用户量级',c.total,p?.total,'',false),
        make('团队规模',c.team_size,p?.team_size,'',false),
        make('平均人效',c.avg_efficiency,p?.avg_efficiency,'',false),
        make('当前转率',c.conv_rate,p?.conv_rate,'%',true),
        make('绩优转率',c.top_conv_rate,p?.top_conv_rate,'%',true),
        make('绩中转率',c.mid_conv_rate,p?.mid_conv_rate,'%',true),
        make('绩差转率',c.bottom_conv_rate,p?.bottom_conv_rate,'%',true),
        make('定金率',c.deposit_rate,p?.deposit_rate,'%',true)
      ];
    },

    // ===== COMPARISON TABLE =====
    get compLabel() {
      const s = this.data?.meta?.semester||'';
      return s+'-'+this.currentPeriod.padStart(2,'0')+' VS '+s+'-'+String(Number(this.currentPeriod)-1).padStart(2,'0');
    },
    get compRows() {
      const c=this.curOverall(), p=this.prevOverall();
      if(!c) return [];
      const rows = [
        {label:'用户量级',cv:c.total,pv:p?.total,r:false},
        {label:'转化人数',cv:c.conv_count,pv:p?.conv_count,r:false},
        {label:'转化率',cv:c.conv_rate,pv:p?.conv_rate,r:true},
        {label:'最新到课率',cv:c.latest_att,pv:p?.latest_att,r:true},
        {label:'发布会到课率',cv:c.launch_att,pv:p?.launch_att,r:true},
        {label:'定金率',cv:c.deposit_rate,pv:p?.deposit_rate,r:true},
        {label:'定金转化率',cv:c.deposit_conv_rate,pv:p?.deposit_conv_rate,r:true},
        {label:'团队规模',cv:c.team_size,pv:p?.team_size,r:false},
        {label:'平均人效',cv:c.avg_efficiency,pv:p?.avg_efficiency,r:false}
      ];
      return rows.map(x=>{
        const cur = x.cv!=null?(x.r?this.n2(x.cv)+'%':x.cv):'-';
        const prev = x.pv!=null?(x.r?this.n2(x.pv)+'%':x.pv):'-';
        let diff='-',cls='';
        if(x.cv!=null&&x.pv!=null){const d=x.cv-x.pv; diff=(d>=0?'+':'')+( x.r?d.toFixed(2)+'pp':d); cls=d>0?'text-green-600 dark:text-green-400':d<0?'text-red-600 dark:text-red-400':'';}
        return {label:x.label,cur,prev,diff,cls};
      });
    },

    // ===== DIMENSION TABLE (UNIFORM) =====
    dimTableHTML(key) {
      const cur = this.curMod()?.[key]||[];
      const prev = this.prevMod()?.[key]||[];
      if(!cur.length) return '<p class="text-xs text-gray-400 text-center py-3">暂无数据</p>';
      const convs = cur.map(r=>r.conv_rate).filter(v=>v!=null&&v>0);
      const minC = convs.length?Math.min(...convs):0, maxC = convs.length?Math.max(...convs):1;
      let h = '<div class="overflow-x-auto scroll-x"><table class="w-full dim-table"><thead><tr class="border-b dark:border-gray-700 text-gray-500 dark:text-gray-400">';
      h += '<th class="text-left">维度名称</th><th class="text-right">当期人数</th><th class="text-right">上期人数</th><th class="text-right">用户占比</th><th class="text-right">人数同比</th><th class="text-right">占比同比</th><th class="text-right">转化率</th>';
      h += '</tr></thead><tbody>';
      let tCur=0,tPrev=0,tConv=0;
      cur.forEach(r=>{
        const pr = prev.find(p=>p.name===r.name);
        const pt = pr?.total||0, pp = pr?.pct||0;
        const cd = r.total-pt, pd = r.pct-pp;
        tCur+=r.total; tPrev+=pt; tConv+=(r.total*(r.conv_rate||0)/100);
        const hc = this.heatCls(r.conv_rate,minC,maxC);
        const isHL = (key==='byChannel' && this.channelFilter && r.name===this.channelFilter);
        h += '<tr class="border-b dark:border-gray-700/50 hover:bg-gray-50 dark:hover:bg-gray-700/30'+(isHL?' ring-2 ring-brand-500 ring-inset bg-blue-50 dark:bg-blue-900/20':'') +'">';
        h += '<td class="font-medium">'+this.esc(r.name)+'</td>';
        h += '<td class="text-right">'+r.total+'</td>';
        h += '<td class="text-right text-gray-500">'+(pr?pt:'-')+'</td>';
        h += '<td class="text-right">'+r.pct.toFixed(2)+'%</td>';
        h += '<td class="text-right '+(pr?(cd>0?'text-green-600 dark:text-green-400':cd<0?'text-red-600 dark:text-red-400':''):'')+'">'+( pr?(cd>0?'+':'')+cd:'-')+'</td>';
        h += '<td class="text-right '+(pr?(pd>0.5?'text-green-600 dark:text-green-400':pd<-0.5?'text-red-600 dark:text-red-400':''):'')+'">'+( pr?(pd>0?'+':'')+pd.toFixed(2)+'pp':'-')+'</td>';
        h += '<td class="text-right font-medium '+hc+'">'+(r.conv_rate!=null?r.conv_rate.toFixed(2)+'%':'-')+'</td>';
        h += '</tr>';
      });
      const tRate = tCur>0?(tConv/tCur*100):0;
      const tDiff = tCur-tPrev;
      h += '<tr class="border-t-2 dark:border-gray-600 font-semibold bg-gray-50 dark:bg-gray-700/40">';
      h += '<td>总计</td><td class="text-right">'+tCur+'</td><td class="text-right">'+(tPrev||'-')+'</td><td class="text-right">100%</td>';
      h += '<td class="text-right '+(tPrev?(tDiff>0?'text-green-600 dark:text-green-400':tDiff<0?'text-red-600 dark:text-red-400':''):'')+'">'+( tPrev?(tDiff>0?'+':'')+tDiff:'-')+'</td>';
      h += '<td class="text-right">-</td><td class="text-right">'+tRate.toFixed(2)+'%</td></tr>';
      h += '</tbody></table></div>';
      return h;
    },

    // ===== TUTOR TABLE (with efficiency + tutor_count) =====
    tutorTableHTML(key) {
      const cur = this.curMod()?.[key]||[];
      const prev = this.prevMod()?.[key]||[];
      if(!cur.length) return '<p class="text-xs text-gray-400 text-center py-3">暂无数据</p>';
      const convs = cur.map(r=>r.conv_rate).filter(v=>v>0);
      const minC=convs.length?Math.min(...convs):0, maxC=convs.length?Math.max(...convs):1;
      let h = '<div class="overflow-x-auto scroll-x"><table class="w-full dim-table"><thead><tr class="border-b dark:border-gray-700 text-gray-500 dark:text-gray-400">';
      h += '<th class="text-left">维度</th><th class="text-right">班主任人数</th><th class="text-right">人效</th><th class="text-right">占比</th><th class="text-right">上期占比</th><th class="text-right">占比同比</th><th class="text-right">转化率</th>';
      h += '</tr></thead><tbody>';
      let tTutor=0;
      cur.forEach(r=>{
        const pr = prev.find(p=>p.name===r.name);
        const pp = pr?.pct||0, pd = r.pct-pp;
        tTutor += (r.tutor_count||0);
        const nm = r.name==='老'?'老辅导':r.name==='新'?'新辅导':r.name;
        const hc = this.heatCls(r.conv_rate,minC,maxC);
        h += '<tr class="border-b dark:border-gray-700/50 hover:bg-gray-50 dark:hover:bg-gray-700/30">';
        h += '<td class="font-medium">'+this.esc(nm)+'</td>';
        h += '<td class="text-right">'+(r.tutor_count||'-')+'</td>';
        h += '<td class="text-right">'+(r.efficiency||'-')+'</td>';
        h += '<td class="text-right">'+r.pct.toFixed(2)+'%</td>';
        h += '<td class="text-right text-gray-500">'+(pr?pp.toFixed(2)+'%':'-')+'</td>';
        h += '<td class="text-right '+(pr?(pd>0.5?'text-green-600 dark:text-green-400':pd<-0.5?'text-red-600 dark:text-red-400':''):'')+'">'+( pr?(pd>0?'+':'')+pd.toFixed(2)+'pp':'-')+'</td>';
        h += '<td class="text-right font-medium '+hc+'">'+(r.conv_rate!=null?r.conv_rate.toFixed(2)+'%':'-')+'</td>';
        h += '</tr>';
      });
      h += '<tr class="border-t-2 dark:border-gray-600 font-semibold bg-gray-50 dark:bg-gray-700/40">';
      h += '<td>总计</td><td class="text-right">'+tTutor+'</td><td class="text-right">-</td><td class="text-right">100%</td><td class="text-right">-</td><td class="text-right">-</td>';
      h += '<td class="text-right">'+(this.curMod()?.overall?.conv_rate!=null?this.curMod().overall.conv_rate.toFixed(2)+'%':'-')+'</td></tr>';
      h += '</tbody></table></div>';
      return h;
    },

    // ===== TEAM TABLE =====
    teamTableHTML() {
      const cur = this.curMod()?.byTeam||[];
      if(!cur.length) return '<p class="text-xs text-gray-400 text-center py-3">暂无数据</p>';
      const convs = cur.map(r=>r.conv_rate).filter(v=>v>0);
      const minC=convs.length?Math.min(...convs):0, maxC=convs.length?Math.max(...convs):1;
      let h = '<div class="overflow-x-auto scroll-x"><table class="w-full dim-table"><thead><tr class="border-b dark:border-gray-700 text-gray-500 dark:text-gray-400">';
      h += '<th class="text-left">团队/组长</th><th class="text-right">用户数</th><th class="text-right">占比</th><th class="text-right">转化率</th><th class="text-right">定金率</th>';
      h += '</tr></thead><tbody>';
      cur.forEach(r=>{
        const hc = this.heatCls(r.conv_rate,minC,maxC);
        h += '<tr class="border-b dark:border-gray-700/50 hover:bg-gray-50 dark:hover:bg-gray-700/30">';
        h += '<td class="font-medium">'+this.esc(r.name)+'</td>';
        h += '<td class="text-right">'+r.total+'</td>';
        h += '<td class="text-right">'+r.pct.toFixed(2)+'%</td>';
        h += '<td class="text-right font-medium '+hc+'">'+r.conv_rate.toFixed(2)+'%</td>';
        h += '<td class="text-right">'+(r.deposit_rate!=null?r.deposit_rate+'%':'-')+'</td>';
        h += '</tr>';
      });
      h += '</tbody></table></div>';
      return h;
    },

    // ===== HEAT COLOR =====
    heatCls(value, min, max) {
      if(value==null||value<=0) return '';
      const ratio = (value-min)/(max-min||1);
      if(ratio>0.6) return 'heat-g-high';
      if(ratio<0.3) return 'heat-g-low';
      return '';
    },

    // ===== FUNNEL =====
    funnelSteps() {
      const m = this.curMod(); if(!m) return [];
      const total = m.overall?.total||1;
      const svcNum = (label) => { const s=(m.service||[]).find(x=>x.label===label); if(!s?.display) return 0; const n=parseInt(s.display.replace(/[^\d]/g,'')); return isNaN(n)?0:n; };
      return [
        {label:'总用户数',display:total+'人',pct:100},
        {label:'加微',display:svcNum('加微人数')+'人',pct:(svcNum('加微人数')/total*100)},
        {label:'摸底测',display:svcNum('摸底测人数')+'人',pct:(svcNum('摸底测人数')/total*100)},
        {label:'定金人数',display:(m.deposit?.count||0)+'人',pct:(m.deposit?.rate||0)},
        {label:'转化人数',display:(m.overall?.conv_count||0)+'人',pct:(m.overall?.conv_rate||0)}
      ];
    },

    // ===== COMMUNICATION ITEMS =====
    commItems() {
      const c = this.curMod()?.communication;
      if (!c) return [];
      return [
        {label:'课前5min沟通率', value:c.pre_5min_rate},
        {label:'课后5min沟通率', value:c.post_5min_rate},
        {label:'课后15min-1轮率', value:c.post_15min_1round_rate},
        {label:'课后20min沟通率', value:c.post_20min_rate},
        {label:'到课深沟覆盖率', value:c.deep_cover_att_rate},
        {label:'0轮沟通成功率', value:c.zero_round_success},
        {label:'一轮沟通成功率', value:c.one_round_success},
        {label:'二轮+沟通成功率', value:c.two_round_success},
        {label:'课前累计通时(min)', value:c.pre_talk_time}
      ].filter(x => x.value != null || true);
    },

    // ===== AUTO INSIGHTS =====
    autoInsights() {
      const c=this.curOverall(), p=this.prevOverall();
      if(!c) return [];
      const t = this.data?.targets?.[this.currentProduct]||{};
      const ins = [];
      if(c.conv_rate!=null&&t.conv_rate) {
        if(c.conv_rate>=t.conv_rate) ins.push({i:'✅',c:'ok',t:'转化率 '+c.conv_rate+'% 已达目标 '+t.conv_rate+'%'});
        else ins.push({i:'⚠️',c:'warn',t:'转化率 '+c.conv_rate+'% 距目标 '+t.conv_rate+'% 差 '+(t.conv_rate-c.conv_rate).toFixed(2)+'pp'});
      }
      if(c.latest_att!=null&&t.latest_att&&c.latest_att<t.latest_att) {
        ins.push({i:'⚠️',c:'warn',t:'最新到课率 '+c.latest_att+'% 低于目标 '+t.latest_att+'%，缺口 '+(t.latest_att-c.latest_att).toFixed(1)+'pp'});
      }
      if(p&&c.conv_rate!=null&&p.conv_rate!=null) {
        const d=c.conv_rate-p.conv_rate;
        if(d>2) ins.push({i:'✅',c:'ok',t:'转化率环比上升 '+d.toFixed(2)+'pp，增长显著'});
        else if(d<-2) ins.push({i:'❌',c:'warn',t:'转化率环比下降 '+Math.abs(d).toFixed(2)+'pp，需重点关注'});
      }
      if(c.top_conv_rate!=null&&c.bottom_conv_rate!=null) {
        const gap=c.top_conv_rate-c.bottom_conv_rate;
        if(gap>15) ins.push({i:'ℹ️',c:'info',t:'绩优绩差差距 '+gap.toFixed(1)+'pp，差异较大，建议针对性培训'});
      }
      const chs = this.curMod()?.byChannel||[];
      const hi = chs.filter(x=>x.conv_rate>20);
      const lo = chs.filter(x=>x.conv_rate>0&&x.conv_rate<12&&x.pct>20);
      if(hi.length) ins.push({i:'✅',c:'ok',t:'高质量渠道: '+hi.map(x=>x.name+'('+x.conv_rate+'%)').join(', ')});
      if(lo.length) ins.push({i:'⚠️',c:'warn',t:'低转化高占比渠道: '+lo.map(x=>x.name+'('+x.conv_rate+'%, 占'+x.pct+'%)').join(', ')});
      return ins;
    },

    // ===== MARKDOWN RENDERER =====
    renderMD(text) {
      if(!text) return '<p class="text-xs text-gray-400 text-center py-3">暂无分析内容</p>';
      return text.split('\n').map(line => {
        if(/━━.*━━/.test(line)) return '<h3>'+line.replace(/━━/g,'').trim()+'</h3>';
        line = line.replace(/\[紧急\]/g,'<span class="tag-badge tag-urgent">[紧急]</span>');
        line = line.replace(/\[本周\]/g,'<span class="tag-badge tag-week">[本周]</span>');
        line = line.replace(/\[本月\]/g,'<span class="tag-badge tag-month">[本月]</span>');
        line = line.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');
        if(line.includes('→')) line = '<span class="text-gray-600 dark:text-gray-300">'+line+'</span>';
        if(line.trim()==='') return '<div class="h-2"></div>';
        const indent = line.match(/^(\s+)/);
        if(indent) { const px=indent[1].length*6; line='<span style="padding-left:'+px+'px">'+line.trim()+'</span>'; }
        return '<p class="my-0.5 text-sm leading-relaxed">'+line+'</p>';
      }).join('');
    },

    // ===== GLOBAL TAB HELPERS =====
    getGlobalLatest(key) {
      const arr = this.data?.[key]||[];
      if(!arr.length) return null;
      return arr.reduce((m,d)=>Number(d.period)>Number(m.period)?d:m, arr[0]);
    },

    // ===== CHARTS =====
    renderAllCharts() {
      // Dispose old
      Object.values(this.chartInstances).forEach(c => { try{c.dispose();}catch(e){} });
      this.chartInstances = {};
      if(this.currentTab==='global') this.chartGlobalTrend();
      if(this.currentTab==='core') this.chartCoreTrend();
      if(this.currentTab==='attendance') this.chartLessonAtt();
    },
    getChartTheme() { return this.darkMode ? 'dark' : undefined; },
    chartGlobalTrend() {
      const el = document.getElementById('chart-global-trend'); if(!el) return;
      const chart = echarts.init(el, this.getChartTheme()); this.chartInstances['global'] = chart;
      const allP = new Set();
      this.products.forEach(p => (this.data?.[p.key]||[]).forEach(d=>allP.add(d.period)));
      const periods = [...allP].sort((a,b)=>Number(a)-Number(b));
      const series = [];
      this.products.forEach(p=>{
        const arr = this.data?.[p.key]||[];
        const vals = periods.map(pd => { const d=arr.find(x=>x.period===pd); return d?.modules?.overall?.conv_rate??null; });
        if(vals.some(v=>v!=null&&v>0)) series.push({name:p.label,type:'line',data:vals,smooth:true,connectNulls:true,symbolSize:5});
      });
      chart.setOption({backgroundColor:'transparent',tooltip:{trigger:'axis',formatter:(ps)=>ps.map(p=>p.seriesName+': '+(p.value!=null?p.value+'%':'-')).join('<br>')},legend:{bottom:0,textStyle:{fontSize:10}},grid:{top:20,right:20,bottom:35,left:45},xAxis:{type:'category',data:periods.map(p=>'第'+p+'期')},yAxis:{type:'value',axisLabel:{formatter:'{value}%'}},series});
      new ResizeObserver(()=>chart.resize()).observe(el);
    },
    chartCoreTrend() {
      const el = document.getElementById('chart-core-trend'); if(!el) return;
      const chart = echarts.init(el, this.getChartTheme()); this.chartInstances['core'] = chart;
      const arr = [...(this.data?.[this.currentProduct]||[])].sort((a,b)=>Number(a.period)-Number(b.period));
      const ps = arr.map(d=>'第'+d.period+'期');
      const conv = arr.map(d=>d.modules?.overall?.conv_rate??null);
      const att = arr.map(d=>d.modules?.overall?.latest_att??null);
      const tgt = this.data?.targets?.[this.currentProduct]?.conv_rate;
      const series = [
        {name:'转化率',type:'line',data:conv,smooth:true,symbolSize:5,itemStyle:{color:'#3b82f6'}},
        {name:'最新到课率',type:'line',data:att,smooth:true,symbolSize:5,itemStyle:{color:'#10b981'}}
      ];
      if(tgt) series.push({name:'目标转化率',type:'line',data:ps.map(()=>tgt),lineStyle:{type:'dashed',color:'#ef4444'},itemStyle:{color:'#ef4444'},symbol:'none'});
      chart.setOption({backgroundColor:'transparent',tooltip:{trigger:'axis'},legend:{bottom:0,textStyle:{fontSize:10}},grid:{top:20,right:20,bottom:35,left:45},xAxis:{type:'category',data:ps},yAxis:{type:'value',axisLabel:{formatter:'{value}%'}},series});
      new ResizeObserver(()=>chart.resize()).observe(el);
    },
    chartLessonAtt() {
      const el = document.getElementById('chart-lesson-att'); if(!el) return;
      const chart = echarts.init(el, this.getChartTheme()); this.chartInstances['att'] = chart;
      const lessons = this.curMod()?.lessonAtt||[];
      const labels = lessons.map(l=>l.label);
      const rates = lessons.map(l=>l.rate);
      const tgt = this.data?.targets?.[this.currentProduct]?.latest_att;
      const series = [{name:'到课率',type:'bar',data:rates,itemStyle:{color:(p)=>p.data>=70?'#10b981':p.data>=55?'#f59e0b':'#ef4444'},label:{show:true,position:'top',formatter:'{c}%',fontSize:9},barMaxWidth:40}];
      if(tgt) series.push({name:'目标',type:'line',data:labels.map(()=>tgt),lineStyle:{type:'dashed',color:'#ef4444'},itemStyle:{color:'#ef4444'},symbol:'none'});
      chart.setOption({backgroundColor:'transparent',tooltip:{trigger:'axis'},legend:{bottom:0,textStyle:{fontSize:10}},grid:{top:30,right:15,bottom:35,left:45},xAxis:{type:'category',data:labels},yAxis:{type:'value',max:100,axisLabel:{formatter:'{value}%'}},series});
      new ResizeObserver(()=>chart.resize()).observe(el);
    },

    // ===== ACTIONS =====
    switchProduct() { const ps=this.periods; if(ps.length&&!ps.includes(this.currentPeriod)) this.currentPeriod=ps[0]; this.$nextTick(()=>this.renderAllCharts()); },
    switchPeriod() { this.$nextTick(()=>this.renderAllCharts()); },
    toggleDark() { this.darkMode=!this.darkMode; localStorage.setItem('suyang_dark',this.darkMode?'1':'0'); this.$nextTick(()=>this.renderAllCharts()); },
    doImport() {
      try { const d=JSON.parse(this.importText); this.data=d; localStorage.setItem('suyang_dashboard_data',JSON.stringify(d)); this.fromCache=true; this.importMsg='导入成功'; this.importOk=true; this.importText=''; this.$nextTick(()=>this.renderAllCharts()); }
      catch(e) { this.importMsg='导入失败: '+e.message; this.importOk=false; }
    },
    fileImport(ev) {
      const f=ev.target.files[0]; if(!f)return;
      const r=new FileReader();
      r.onload=(e)=>{try{const d=JSON.parse(e.target.result);this.data=d;localStorage.setItem('suyang_dashboard_data',JSON.stringify(d));this.fromCache=true;this.importMsg='文件导入成功';this.importOk=true;this.$nextTick(()=>this.renderAllCharts());}catch(err){this.importMsg='解析失败: '+err.message;this.importOk=false;}};
      r.readAsText(f);
    },
    exportCSV() {
      const arr=this.data?.[this.currentProduct]||[]; if(!arr.length){alert('无数据');return;}
      let csv='﻿期数,用户量级,转化人数,转化率,最新到课率,发布会到课率,定金率,定金转化率,团队规模,人效\n';
      [...arr].sort((a,b)=>Number(a.period)-Number(b.period)).forEach(pd=>{const o=pd.modules?.overall||{}; csv+=`${pd.period},${o.total||''},${o.conv_count||''},${o.conv_rate||''},${o.latest_att||''},${o.launch_att||''},${o.deposit_rate||''},${o.deposit_conv_rate||''},${o.team_size||''},${o.avg_efficiency||''}\n`;});
      this.download(csv,'text/csv',`suyang_${this.currentProduct}.csv`);
    },
    exportJSON() { this.download(JSON.stringify(this.data,null,2),'application/json','suyang_data.json'); },
    download(content,type,name) { const b=new Blob([content],{type}); const u=URL.createObjectURL(b); const a=document.createElement('a'); a.href=u; a.download=name; a.click(); URL.revokeObjectURL(u); },
    clearCache() { localStorage.removeItem('suyang_dashboard_data'); this.fromCache=false; const el=document.getElementById('embedded-data'); if(el){try{this.data=JSON.parse(el.textContent);}catch(e){}} this.$nextTick(()=>this.renderAllCharts()); },

    // ===== UTILITIES =====
    n2(v) { if(v==null) return '-'; const s=Number(v).toFixed(2); return s.replace(/\.?0+$/,'')||'0'; },
    esc(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
  };
}
</script>
</body>
</html>
